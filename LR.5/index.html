<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>JS Laboratory</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<section>
<h2>Лампочка</h2>

<div id="bulb" class="bulb"></div>

<button id="toggleBtn">On/Off</button>
<button id="typeBtn">Тип лампи</button>
<button id="brightBtn">Яскравість</button>
</section>


<section>
<h2>Світлофор</h2>

<div class="traffic">
  <div id="red" class="light red"></div>
  <div id="yellow" class="light yellow"></div>
  <div id="green" class="light green"></div>
</div>

<p id="trafficText"></p>
<button id="manualBtn">Наступний стан</button>

</section>


<section>
<h2>Час</h2>

<div id="clock" class="clock"></div>

<input type="datetime-local" id="timerInput">
<button id="startTimer">Старт таймера</button>

<p id="countdown"></p>

<input type="month" id="monthPicker">
<table id="calendar"></table>

</section>


<section>
<h2>Магазин</h2>

<button id="addProduct">Додати продукт</button>
<button id="orderProduct">Замовити</button>

<pre id="shopOutput"></pre>

</section>

<script src="script.js"></script>
</body>
</html>
